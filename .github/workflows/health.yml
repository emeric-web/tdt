name: Disponibilité

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    # Sans URL publique configurée (variable de dépôt HEALTH_URL), il n'y a rien à surveiller.
    if: vars.HEALTH_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Interroger /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          curl --fail --silent --show-error \
            --max-time 10 --retry 2 --retry-delay 10 --retry-all-errors \
            "${HEALTH_URL%/}/api/health"
