name: Release

on:
  workflow_run:
    workflows: ["Qualité, tests et construction Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    # Automatique : seulement après une CI réussie sur un push de main.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Requis par `prisma generate` (postinstall) ; aucune connexion n'est ouverte.
      DATABASE_URL: postgresql://tdt:tdt@localhost:5432/tdt?schema=public

    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Vérifier que main n'a pas avancé depuis la CI
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main a avancé depuis la CI : la release sera traitée par la CI du dernier commit."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Préparer Node.js et le cache npm
        if: env.SKIP_RELEASE != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Installer les dépendances
        if: env.SKIP_RELEASE != 'true'
        run: npm ci

      - name: Générer la version, le changelog et la release GitHub
        if: env.SKIP_RELEASE != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Récupérer la version publiée
        if: env.SKIP_RELEASE != 'true'
        id: version
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        if: env.SKIP_RELEASE != 'true' && steps.version.outputs.value != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier les images numérotées
        if: env.SKIP_RELEASE != 'true' && steps.version.outputs.value != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"

          docker build \
            --target runner \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:$VERSION" \
            -t "$image:$minor" \
            -t "$image:$major" \
            -t "$image:latest" \
            .

          docker push --all-tags "$image"

          docker build \
            --target migrate \
            -t "$image:$VERSION-migrate" \
            .

          docker push "$image:$VERSION-migrate"
